name: CBOS CI

on:
  pull_request:
    branches:
      - main
      - feature/reporting-engine
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cbos-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    name: Windows validation (Python 3.14)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Reject tracked runtime and release files
        shell: pwsh
        run: |
          $prohibited = git ls-files | Where-Object {
            $_ -match '(^|/)(\.env($|\.)|.*\.(db|sqlite|sqlite3|log|pyc|pfx|p12|pem|key|exe|msi)$|backups/|logs/|release/|dist/|build/|licenses/|updates/|rollback/|__pycache__/|\.pytest_cache/|\.venv/)'
          }
          if ($prohibited) {
            $prohibited | ForEach-Object { Write-Error "Prohibited tracked file: $_" }
            throw "Tracked runtime, credential, cache, release, or installer files were found."
          }

      - name: Run complete automated test suite
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Validate source release metadata
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:RUNNER_TEMP "cbos-source-validation"
          New-Item -ItemType Directory -Path $releaseDirectory | Out-Null
          Set-Content -Path (Join-Path $releaseDirectory "source-validation.txt") -Value "Source-only CI validation; no installer artifacts."
          python scripts/validate_release.py evidence --release-dir $releaseDirectory --source-commit $env:GITHUB_SHA

      - name: Check whitespace
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $baseCommit = git merge-base HEAD "origin/$env:GITHUB_BASE_REF"
            git diff --check "$baseCommit..HEAD"
          } elseif ($env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
            git diff --check "$env:BEFORE_SHA..HEAD"
          } else {
            git show --check --format= HEAD
          }
