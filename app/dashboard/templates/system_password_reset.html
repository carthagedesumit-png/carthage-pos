{% extends "base.html" %}{% block content %}
<section class="hero"><div><h1>Reset Password</h1><p>{{ user.username }} &middot; all existing sessions will be revoked.</p></div></section>
<section class="panel narrow-panel">{% if errors.form %}<div class="alert error" role="alert">{{ errors.form }}</div>{% endif %}<form class="management-form" method="post" action="/dashboard/system/users/{{ user.id }}/password?csrf_token={{ csrf_token }}"><label><span>Temporary password</span><input type="password" name="temporary_password" required minlength="12" autocomplete="new-password"><small>12+ characters with upper/lower case, number, and symbol. Recent passwords are rejected.</small></label><label class="confirmation-check"><input type="checkbox" required><span>I confirm this secure password reset</span></label><button class="primary-action" type="submit">Reset Password</button><a href="/dashboard/system/users/{{ user.id }}">Cancel</a></form></section>
{% endblock %}
