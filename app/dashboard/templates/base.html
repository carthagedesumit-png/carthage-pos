<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/dashboard/static/css/dashboard.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-brand">
            <h2>Carthage POS</h2>
        </div>

        <nav class="sidebar-menu">
            <a class="{{ 'active' if active_page == 'dashboard' else '' }}" href="/dashboard/">🏠 Dashboard</a>
            <a class="{{ 'active' if active_page == 'sales' else '' }}" href="/dashboard/sales">🛒 Sales</a>
            <a class="{{ 'active' if active_page == 'inventory' else '' }}" href="/dashboard/inventory">📦 Inventory</a>
            <a class="{{ 'active' if active_page == 'customers' else '' }}" href="/dashboard/customers">👥 Customers</a>
            <a class="{{ 'active' if active_page == 'procurement' else '' }}" href="/dashboard/procurement">🚚 Procurement</a>
            <a class="{{ 'active' if active_page == 'reports' else '' }}" href="/dashboard/reports">📈 Reports</a>
            <a class="{{ 'active' if active_page == 'system' else '' }}" href="/dashboard/system">⚙ System</a>
        </nav>

    </aside>

    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

</div>

<script src="/dashboard/static/js/dashboard.js"></script>

</body>

</html>
