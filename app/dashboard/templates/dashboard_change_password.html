{% extends "base.html" %}{% block content %}<section class="hero"><div><h1>Change Temporary Password</h1><p>A new secure password is required before continuing.</p></div></section><section class="panel narrow-panel">{% if errors.form %}<div class="alert error" role="alert">{{ errors.form }}</div>{% endif %}<form class="management-form" method="post" action="/dashboard/change-password?csrf_token={{ csrf_token }}"><label><span>Current temporary password</span><input type="password" name="current_password" required autocomplete="current-password"></label><label><span>New password</span><input type="password" name="new_password" required minlength="12" autocomplete="new-password"></label><small>12+ characters with upper/lower case, number, and symbol. Recent passwords are rejected.</small><button class="primary-action" type="submit">Change Password</button></form></section>{% endblock %}
